<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEXORIS 26 - Full Background Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0 bg-[#0A0412] text-white">

  <!-- Fullscreen Hero Section -->
  <section class="relative w-full h-screen overflow-hidden flex flex-col justify-between p-12">
    
    <!-- Full-screen Background Artwork -->
    <div class="absolute inset-0 w-full h-full z-0 pointer-events-none">
      <img 
        src="/Vexoris%2026_%20Sunset%20City%20Rush.png" 
        alt="Background" 
        class="w-full h-full object-cover object-center"
      />
      <!-- Subtle lower-left gradient only for text contrast -->
      <div class="absolute inset-0 bg-gradient-to-tr from-black/80 via-transparent to-transparent"></div>
    </div>

    <!-- Foreground Content -->
    <div class="relative z-10 max-w-xl">
      <h1 class="text-5xl font-black text-[#FF4B72]">RULE THE PLAYGROUND.</h1>
      <p class="mt-4 text-slate-200">A college fest where technology, gaming and creativity collide.</p>
    </div>

  </section>

</body>
</html>
